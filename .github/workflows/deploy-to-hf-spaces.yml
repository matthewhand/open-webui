name: Validate Open WebUI candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  # ── Ruff format check across supported Python versions ───────────────────
  format-check:
    name: Ruff Format (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          ref: bae45eed5f716904aacf5927c9033b52b0ece6f3

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install formatter
        run: pip install "ruff>=0.15.5"

      - name: Verify formatting
        run: ruff format --check . --exclude .venv --exclude venv

      - name: Detect logic errors
        run: ruff check --select=F --ignore=F401,F403,F405,F541,F811,F841 --output-format=github .

  # ── Dockerfile lock files match the requirements files ───────────────────
  lock-check:
    name: Requirements locks up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          ref: bae45eed5f716904aacf5927c9033b52b0ece6f3

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv==0.12.10

      - name: Regenerate locks
        run: backend/update-locks.sh

      - name: Verify locks are up to date
        run: test -z "$(git status --porcelain -- backend)"
  # ── Format, i18n, and production build ────────────────────────────────────
  format-and-build:
    name: Format & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          ref: bae45eed5f716904aacf5927c9033b52b0ece6f3

      - uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --force

      - name: Verify code formatting
        run: npm run format

      - name: Verify i18n strings
        run: npm run i18n:parse

      - name: Ensure working tree is clean
        run: git diff --exit-code

      - name: Production build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  # ── Vitest unit tests ────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          ref: bae45eed5f716904aacf5927c9033b52b0ece6f3

      - uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'

      - name: Install dependencies (frozen lockfile)
        run: npm ci --force

      - name: Execute test suite
        run: npm run test:frontend
